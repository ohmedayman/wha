<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Flow Pro - المنصة السحابية لإدارة وتسويق واتساب</title>
    <link rel="icon" type="image/png" href="/app-icon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #06090e;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #10b981;
            --primary-hover: #059669;
            --primary-glow: rgba(16, 185, 129, 0.35);
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body {
            background: var(--bg-color);
            background-image: radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.18) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 36px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(6, 9, 14, 0.7);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }
        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #10b981, #059669);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: white;
            box-shadow: 0 4px 14px rgba(16,185,129,0.4);
        }
        .brand-text { font-size: 1.25rem; font-weight: 900; }
        .brand-badge {
            background: linear-gradient(135deg, #10b981, #059669);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 800;
            margin-right: 6px;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .admin-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            transition: 0.2s;
        }
        .admin-link:hover {
            color: white;
            border-color: var(--primary);
            background: rgba(16,185,129,0.1);
        }
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .portal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 520px;
            padding: 36px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            backdrop-filter: blur(16px);
        }
        .tabs {
            display: flex;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }
        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-muted);
            padding: 10px 0;
            border-radius: 9px;
            font-weight: 800;
            font-size: 0.88rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(16,185,129,0.35);
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 0.84rem;
            font-weight: 800;
            margin-bottom: 6px;
            color: var(--text-main);
        }
        .form-control {
            width: 100%;
            height: 46px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border-color);
            border-radius: 11px;
            padding: 0 14px;
            color: white;
            font-size: 0.92rem;
            outline: none;
            transition: 0.2s;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
        .btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.96rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 6px 20px rgba(16,185,129,0.35);
        }
        .btn-primary:hover { opacity: 0.95; transform: translateY(-1px); }
        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: white;
            margin-top: 12px;
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.12); }
        .btn-download {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(59,130,246,0.35);
            margin-top: 14px;
        }
        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.86rem;
            margin-bottom: 16px;
            display: none;
        }
        .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; }
        .alert-success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #86efac; }
        .footer {
            text-align: center;
            padding: 18px;
            font-size: 0.82rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="/" class="brand">
            <div class="brand-icon"><i class="fa-brands fa-whatsapp"></i></div>
            <div class="brand-text">WhatsApp Flow <span class="brand-badge">PRO</span></div>
        </a>
    </header>

    <main class="main-container">
        <div class="portal-card">
            <div style="text-align:center;margin-bottom:24px">
                <h2 style="font-size:1.5rem;font-weight:900;margin-bottom:6px">بوابة المشتركين السحابية 🌐</h2>
                <p style="font-size:0.86rem;color:var(--text-muted)">المنظومة السحابية الموحدة لإدارة التراخيص والتسويق عبر واتساب</p>
            </div>

            <div id="alertBox" class="alert"></div>

            <div class="tabs" id="authTabs">
                <button type="button" class="tab-btn active" id="tabLogin" onclick="switchTab('login')"><i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول</button>
                <button type="button" class="tab-btn" id="tabRegister" onclick="switchTab('register')"><i class="fa-solid fa-user-plus"></i> حساب جديد</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label><i class="fa-solid fa-user" style="color:var(--primary)"></i> اسم المستخدم أو البريد الإلكتروني:</label>
                    <input type="text" id="loginUser" class="form-control" style="direction:ltr;text-align:right" required placeholder="أدخل اسم المستخدم أو الإيميل">
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-lock" style="color:var(--primary)"></i> كلمة المرور:</label>
                    <input type="password" id="loginPass" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-bolt"></i> تسجيل الدخول</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label><i class="fa-solid fa-id-card" style="color:var(--primary)"></i> اسم المستخدم:</label>
                    <input type="text" id="regUser" class="form-control" style="direction:ltr;text-align:right" required placeholder="مثال: user2026">
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-lock" style="color:var(--primary)"></i> كلمة المرور:</label>
                    <input type="password" id="regPass" class="form-control" required placeholder="4 خانات على الأقل">
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-user" style="color:var(--primary)"></i> اسم العميل الكامل:</label>
                    <input type="text" id="regName" class="form-control" required placeholder="اسمك الكريم">
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-building" style="color:var(--primary)"></i> اسم الشركة أو النشاط:</label>
                    <input type="text" id="regCompany" class="form-control" placeholder="مثال: متجر النخبة">
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-phone" style="color:var(--primary)"></i> رقم الهاتف:</label>
                    <input type="tel" id="regPhone" class="form-control" style="direction:ltr;text-align:right" placeholder="01012345678">
                </div>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-user-plus"></i> إنشاء الحساب وتفعيل التجربة</button>
            </form>

            <!-- Logged-in User Dashboard -->
            <div id="userProfileSection" style="display:none;text-align:center">
                <div style="width:64px;height:64px;border-radius:50%;background:rgba(16,185,129,0.2);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 14px;border:1px solid rgba(16,185,129,0.4)">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <h3 id="profName" style="font-weight:900;font-size:1.3rem;margin-bottom:4px">مرحباً بك</h3>
                <p id="profCompany" style="color:var(--text-muted);font-size:0.88rem;margin-bottom:18px"></p>
                
                <div style="background:rgba(255,255,255,0.05);padding:16px;border-radius:14px;margin-bottom:18px;text-align:right;font-size:0.88rem;border:1px solid var(--border-color)">
                    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
                        <span style="color:var(--text-muted)">نوع الاشتراك:</span>
                        <strong id="profPlan" style="color:var(--primary)"></strong>
                    </div>
                    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
                        <span style="color:var(--text-muted)">الصلاحية:</span>
                        <strong id="profExpiry"></strong>
                    </div>
                    <div style="display:flex;justify-content:space-between">
                        <span style="color:var(--text-muted)">حالة المزامنة السحابية:</span>
                        <strong style="color:#10b981"><i class="fa-solid fa-link"></i> متزامن ونشط 🟢</strong>
                    </div>
                </div>

                <button class="btn btn-secondary" onclick="logoutUser()"><i class="fa-solid fa-arrow-right-from-bracket"></i> تسجيل الخروج</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        جميع الحقوق محفوظة &copy; 2026 - WhatsApp Flow Pro | المنظومة الذكية للتسويق المتقدم
    </footer>

    <script>
        let currentUser = null;
        let heartbeatTimer = null;

        function switchTab(tab) {
            document.getElementById('alertBox').style.display = 'none';
            if (tab === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('tabRegister').classList.remove('active');
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
            } else {
                document.getElementById('tabRegister').classList.add('active');
                document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('loginForm').style.display = 'none';
            }
        }

        function showAlert(msg, isSuccess = false) {
            const box = document.getElementById('alertBox');
            box.className = isSuccess ? 'alert alert-success' : 'alert alert-error';
            box.textContent = msg;
            box.style.display = 'block';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const usernameOrEmail = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPass').value.trim();
            try {
                const res = await fetch('/api/user/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usernameOrEmail, password, source: 'web' })
                });
                const data = await res.json();
                if (data.success) {
                    currentUser = data.user;
                    localStorage.setItem('flow_user', JSON.stringify(currentUser));
                    showProfile(currentUser);
                    startHeartbeat();
                } else {
                    showAlert(data.error || 'فشل تسجيل الدخول');
                }
            } catch (err) {
                showAlert('تعذر الاتصال بالسيرفر السحابي');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUser').value.trim();
            const password = document.getElementById('regPass').value.trim();
            const name = document.getElementById('regName').value.trim();
            const company = document.getElementById('regCompany').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            try {
                const res = await fetch('/api/user/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, name, company, phone, plan: 'trial' })
                });
                const data = await res.json();
                if (data.success) {
                    showAlert('تم إنشاء الحساب بنجاح! جاري تسجيل دخولك...', true);
                    currentUser = data.user;
                    localStorage.setItem('flow_user', JSON.stringify(currentUser));
                    setTimeout(() => {
                        showProfile(currentUser);
                        startHeartbeat();
                    }, 1000);
                } else {
                    showAlert(data.error || 'فشل إنشاء الحساب');
                }
            } catch (err) {
                showAlert('تعذر الاتصال بالسيرفر');
            }
        }

        function showProfile(user) {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('authTabs').style.display = 'none';
            document.getElementById('alertBox').style.display = 'none';
            document.getElementById('userProfileSection').style.display = 'block';

            document.getElementById('profName').textContent = 'مرحباً ' + (user.name || user.username);
            document.getElementById('profCompany').textContent = user.company ? `(${user.company})` : 'مؤسسة تجارية';
            document.getElementById('profPlan').textContent = user.plan === 'lifetime' ? 'باقة VIP الدائمة' : (user.plan === 'trial' ? 'تجربة مجانية' : 'اشتراك سنوي');
            document.getElementById('profExpiry').textContent = user.expiry === 'LIFETIME' ? 'غير محدود' : user.expiry;
        }

        function startHeartbeat() {
            if (heartbeatTimer) clearInterval(heartbeatTimer);
            sendPing();
            heartbeatTimer = setInterval(sendPing, 30000);
        }

        async function sendPing() {
            if (!currentUser) return;
            try {
                const res = await fetch('/api/user/heartbeat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser.username, source: 'web' })
                });
                const data = await res.json();
                if (data.isSuspended) {
                    alert('تم تعليق حسابك من قبل الإدارة: ' + data.error);
                    logoutUser();
                }
            } catch (_) {}
        }

        function logoutUser() {
            currentUser = null;
            localStorage.removeItem('flow_user');
            if (heartbeatTimer) clearInterval(heartbeatTimer);
            document.getElementById('userProfileSection').style.display = 'none';
            document.getElementById('authTabs').style.display = 'flex';
            switchTab('login');
        }

        // Auto restore session
        try {
            const saved = localStorage.getItem('flow_user');
            if (saved) {
                currentUser = JSON.parse(saved);
                showProfile(currentUser);
                startHeartbeat();
            }
        } catch (_) {}
    </script>
</body>
</html>
